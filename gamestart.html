<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="shortcut icon" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>🏸 賽程計分</title>
    <link rel="stylesheet" href="/src/styles/gamestart.css">
</head>
<body>

<div class="toolbar-container">
    <div class="toolbar">
        <button class="gamestart-layout-1 tool-btn" onclick="window.location.href='dashboard.html'" disabled data-startup-disabled>◀ 回賽程管理</button>
        <span id="gameTitle" class="gamestart-layout-2"></span>
        <div class="gamestart-layout-3">
            <span id="syncStatus" class="gamestart-layout-4"></span>
            <button class="tool-btn" onclick="reloadGame()" disabled data-startup-disabled>🔄 重新載入</button>
            <button class="tool-btn" id="btnSync" onclick="syncToCloud()" disabled data-startup-disabled>☁️ 儲存至雲端</button>
        </div>
    </div>
</div>

<!-- 分享 Modal -->


<div class="card">
    <h2>📋 賽程與計分</h2>

    <!-- 產生下一輪 -->
    <div id="rematchContainer" class="gamestart-layout-17">
        <div class="gamestart-layout-18">
            <button class="btn-rematch" onclick="generateRematch()" disabled data-startup-disabled>
                🔄 沿用目前分組再打一輪 (新增賽程 <span id="nextScheduleNum"></span>)
            </button>
            <button class="gamestart-layout-19 btn-rematch" onclick="openRegroupModal()" disabled data-startup-disabled>
                🎲 重新分組同樣的人 → 產生新賽程
            </button>
            <button class="gamestart-layout-20 btn-rematch" onclick="generateRankedSingleElimination()" disabled data-startup-disabled>
                🪜 依目前排名產生單敗淘汰賽
            </button>
            <div class="gamestart-layout-21">
                排名規則依目前總戰績排序：先比勝場，再比淨勝分。
            </div>
        </div>
        <div class="gamestart-layout-22"></div>
    </div>

    <!-- 重新分組 Modal -->
    <div id="regroupModal" class="gamestart-layout-23">
        <div class="gamestart-layout-24">
            <div class="gamestart-layout-25">
                <h3 class="gamestart-layout-26">🎲 重新分組同樣的人</h3>
                <button onclick="closeRegroupModal()" class="gamestart-layout-27" disabled data-startup-disabled>&times;</button>
            </div>
            <div class="gamestart-layout-28">
                <button onclick="autoRegroup()" class="gamestart-layout-29" disabled data-startup-disabled>🎲 自動重新分組</button>
                <button onclick="confirmRegroupAndStart('single')" class="gamestart-layout-30" disabled data-startup-disabled>✅ 確認 → 單輪賽</button>
                <button onclick="confirmRegroupAndStart('round-robin')" class="gamestart-layout-31" disabled data-startup-disabled>🏆 確認 → 循環賽</button>
            </div>
            <div class="gamestart-layout-32">
                💡 點「自動重新分組」可依實力重新均衡配對；也可直接點擊兩張球員卡片來互換位置。
            </div>
            <div id="regroupRestMsg" class="gamestart-layout-33"></div>
            <div id="regroupGrid" class="gamestart-layout-34"></div>
        </div>
    </div>

    <div id="standingsArea"></div>
    <div id="schedulesWrapper">
        <div class="gamestart-layout-35">⏳ 載入賽程中...</div>
    </div>
</div>

<script type="module" src="/src/pages/gamestart.js"></script>
</body>
</html>
