<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="計分板">
  <meta name="mobile-web-app-capable" content="yes">
  <title>專業雙色計分板 Pro Scoreboard</title>
  
  <!-- 引入 Tailwind CSS 用於快速版面微調 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Lucide 圖示庫 -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google 字型 (用於精美、有張力的大數字) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Teko:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/src/styles/score.css">
</head>
<body class="flex flex-col md:flex-row relative">

  <!-- 煙火畫布 -->
  <canvas id="celebration-canvas"></canvas>

  <!-- 左邊/上邊：隊伍 A (預設主隊-藍色) -->
  <div id="panel-a" data-score-panel="A" class="team-panel flex-1 flex flex-col justify-between items-center py-8 relative cursor-pointer select-none bg-gradient-to-br from-[#60a5fa] via-[#3b82f6] to-[#1d4ed8] text-white h-1/2 md:h-full">
    <!-- 頂部資訊：隊名與贏家皇冠 -->
    <div class="team-name-zone">
      <div class="team-name-row">
        <!-- 點擊隊名可直接原地修改 -->
        <input type="text" id="name-a" value="主隊" 
               class="team-name-input bg-transparent text-center font-black text-4xl md:text-6xl focus:outline-none focus:border-b-2 border-white/80 cursor-text tracking-wide"
               onclick="event.stopPropagation();" onchange="saveSettings()" disabled data-startup-disabled>
        <span id="crown-a" class="team-crown text-yellow-300 drop-shadow-lg transition-all duration-300 opacity-0 transform scale-50">
          <i data-lucide="crown" class="w-8 h-8 fill-current"></i>
        </span>
      </div>
    </div>

    <!-- 中間大數字 -->
    <div class="score-zone">
      <div class="score-shell">
        <div id="score-a" class="score-number select-none transition-transform duration-100 active:scale-95">0</div>
      </div>
    </div>

  </div>

  <!-- 右邊/下邊：隊伍 B (預設客隊-紅色) -->
  <div id="panel-b" data-score-panel="B" class="team-panel flex-1 flex flex-col justify-between items-center py-8 relative cursor-pointer select-none bg-gradient-to-br from-[#fb7185] via-[#ef4444] to-[#b91c1c] text-white h-1/2 md:h-full">
    <!-- 頂部資訊：隊名與贏家皇冠 -->
    <div class="team-name-zone">
      <div class="team-name-row">
        <input type="text" id="name-b" value="客隊" 
               class="team-name-input bg-transparent text-center font-black text-4xl md:text-6xl focus:outline-none focus:border-b-2 border-white/80 cursor-text tracking-wide"
               onclick="event.stopPropagation();" onchange="saveSettings()" disabled data-startup-disabled>
        <span id="crown-b" class="team-crown text-yellow-300 drop-shadow-lg transition-all duration-300 opacity-0 transform scale-50">
          <i data-lucide="crown" class="w-8 h-8 fill-current"></i>
        </span>
      </div>
    </div>

    <!-- 中間大數字 -->
    <div class="score-zone">
      <div class="score-shell">
        <div id="score-b" class="score-number select-none transition-transform duration-100 active:scale-95">0</div>
      </div>
    </div>

  </div>

  <!-- 懸浮控制板 (位於畫面中央) — 精簡為 3 個按鈕 -->
  <div class="floating-controls absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-30 flex items-center text-gray-800 rounded-full px-5 py-2.5 border border-white/60 gap-5">
    <!-- 全螢幕按鈕 -->
    <button onclick="toggleFullscreen()" id="fullscreen-btn" class="hover:text-[#3b82f6] transition-colors active:scale-90" title="全螢幕" disabled data-startup-disabled>
      <i data-lucide="maximize" class="w-6 h-6 md:w-7 md:h-7"></i>
    </button>
    
    <!-- 設定按鈕 (含歸零) -->
    <button onclick="toggleSettingsModal(true)" class="hover:text-[#3b82f6] transition-colors active:scale-90" title="設定" disabled data-startup-disabled>
      <i data-lucide="settings" class="w-6 h-6 md:w-7 md:h-7"></i>
    </button>
    
    <!-- 交換按鈕 -->
    <button onclick="swapTeams()" class="hover:text-[#3b82f6] transition-colors active:scale-90" title="交換場地" disabled data-startup-disabled>
      <i data-lucide="arrow-left-right" class="w-6 h-6 md:w-7 md:h-7"></i>
    </button>
  </div>

  <!-- 完賽按鈕：底部正中央，低調小按鈕 -->
  <div class="finish-controls absolute left-1/2 transform -translate-x-1/2 z-30">
    <button onclick="finishAndReturn()" 
            class="finish-button flex items-center gap-1.5 hover:bg-black/50 text-white/90 hover:text-white text-xs font-semibold px-5 py-2.5 rounded-full transition-all active:scale-95 border border-white/25"
            title="完成並帶回比分" disabled data-startup-disabled>
      <i data-lucide="check-check" class="w-3.5 h-3.5"></i>
      完賽
    </button>
  </div>

  <!-- 設定對話盒 (Modal) -->
  <div id="settings-modal" class="modal hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl overflow-hidden relative">
      <h3 class="text-xl font-bold mb-4 text-gray-800 flex items-center gap-2">
        <i data-lucide="sliders" class="w-6 h-6 text-blue-500"></i>
        計分板設定
      </h3>
      
      <div class="space-y-4">
        <!-- 勝利分數 -->
        <div>
          <label class="block text-sm font-bold text-gray-600 mb-1">勝利分數限制 (0 代表不設限)</label>
          <div class="flex gap-2">
            <button onclick="setTargetScorePreset(11)" class="flex-1 py-1.5 px-3 bg-gray-100 rounded-lg font-bold text-sm hover:bg-blue-500 hover:text-white transition" disabled data-startup-disabled>11分</button>
            <button onclick="setTargetScorePreset(21)" class="flex-1 py-1.5 px-3 bg-gray-100 rounded-lg font-bold text-sm hover:bg-blue-500 hover:text-white transition" disabled data-startup-disabled>21分</button>
            <button onclick="setTargetScorePreset(25)" class="flex-1 py-1.5 px-3 bg-gray-100 rounded-lg font-bold text-sm hover:bg-blue-500 hover:text-white transition" disabled data-startup-disabled>25分</button>
          </div>
          <input type="number" id="target-score" class="mt-2 w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" min="0" value="11" disabled data-startup-disabled>
        </div>

        <!-- 聲音與震動 -->
        <div class="flex items-center justify-between border-t pt-4">
          <span class="text-sm font-bold text-gray-600">操作音效與提示</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="sound-toggle" class="sr-only peer" checked onchange="saveSettings()" disabled data-startup-disabled>
            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500"></div>
          </label>
        </div>

        <div class="flex items-center justify-between border-t pt-4">
          <span class="text-sm font-bold text-gray-600">觸覺震動回饋 (限手機)</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="vibrate-toggle" class="sr-only peer" checked onchange="saveSettings()" disabled data-startup-disabled>
            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500"></div>
          </label>
        </div>

        <div class="text-xs text-gray-400 border-t pt-3">
          提示：點擊隊伍面板加 1 分；在面板上向下滑動可減 1 分；點擊「主隊 / 客隊」可更改名稱。
        </div>

        <!-- 歸零區塊 -->
        <div class="border-t pt-4">
          <button onclick="toggleSettingsModal(false); confirmReset();" 
                  class="w-full py-2.5 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-xl transition flex items-center justify-center gap-2 border border-red-200" disabled data-startup-disabled>
            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            分數歸零
          </button>
        </div>
      </div>

      <!-- 底部按鈕 -->
      <div class="mt-6 flex gap-3">
        <button onclick="toggleSettingsModal(false)" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-md" disabled data-startup-disabled>
          確定並套用
        </button>
      </div>
    </div>
  </div>

  <!-- 歸零確認對話盒 (Modal) -->
  <div id="reset-modal" class="modal hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl text-center">
      <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 text-red-600 mb-4">
        <i data-lucide="alert-triangle" class="w-6 h-6"></i>
      </div>
      <h3 class="text-lg font-bold text-gray-900 mb-2">確定要把分數歸零嗎？</h3>
      <p class="text-sm text-gray-500 mb-6">目前的比分與勝負狀態將會被清除重置。</p>
      <div class="flex gap-3">
        <button onclick="toggleResetModal(false)" class="flex-1 py-2 px-4 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold rounded-xl transition" disabled data-startup-disabled>
          取消
        </button>
        <button onclick="resetScores()" class="flex-1 py-2 px-4 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl transition shadow-md" disabled data-startup-disabled>
          確定歸零
        </button>
      </div>
    </div>
  </div>

  <!-- 提示浮現訊息 (取代 alert) -->
  <div id="toast" class="fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-gray-900/90 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50">
    已歸零
  </div>

  <script type="module" src="/src/pages/score.js"></script>
</body>
</html>
